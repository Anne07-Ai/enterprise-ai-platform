name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + type + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .
        continue-on-error: true # Existing lint findings tracked in KNOWN_ISSUES.md.

      - name: Type check (mypy)
        run: uv run mypy app
        continue-on-error: true
        # Existing strict typing findings tracked in KNOWN_ISSUES.md.

      - name: Unit tests
        env:
          EAIP_ENVIRONMENT: test
        run: uv run pytest tests/unit -v --cov-fail-under=0

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

  # Integration fixtures provision services and apply migrations. See
  # KNOWN_ISSUES.md for the status of adding those tests to CI.
